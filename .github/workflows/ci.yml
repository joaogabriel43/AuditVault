name: AuditVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    
    # Needs a database and elasticsearch for tests? 
    # Actually, Testcontainers will spin them up automatically during mvn test!
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      run: mvn -B package --file pom.xml

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auditvault-ui

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ./auditvault-ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build Angular app
      run: npm run build --if-present
